function artKey(name){let n=name.toLowerCase();if(n.includes('egg'))return'eggs';if(n.includes('ginger'))return'ginger';if(n.includes('onion'))return'onion';if(n.includes('olive oil')||n==='oil')return'oil';if(n.includes('vinegar'))return'vinegar';if(n.includes('rice'))return'rice';if(n.includes('pasta'))return'pasta';if(n==='salt')return'salt';if(n.includes('pepper'))return'pepper';if(n.includes('trash'))return'trash';if(n.includes('wipe'))return'wipes';if(n.includes('filter'))return'filter';if(n.includes('milk'))return'milk';if(n.includes('chicken'))return'chicken';if(n.includes('deodorant'))return'deodorant';if(n.includes('shampoo'))return'shampoo';if(n.includes('soap'))return'soap';if(n.includes('toothpaste'))return'toothpaste';if(n.includes('coffee'))return'coffee';if(n.includes('paper cup'))return'papercups';if(n.includes('paper plate'))return'paperplates';if(n.includes('windex')||n.includes('glass cleaner'))return'windex';if(n.includes('febreze')||n.includes('fabric refresher'))return'febreze';if(n.includes('laundry'))return'laundry';if(n.includes('detergent')||n.includes('softener')||n.includes('dryer'))return'laundry';if(n.includes('diaper')||n.includes('pull-up'))return'diaper';if(n.includes('pad')||n.includes('tampon')||n.includes('panty liner')||n.includes('feminine'))return'feminine';if(n.includes('vitamin')||n.includes('supplement')||n.includes('probiotic')||n.includes('magnesium')||n.includes('zinc')||n.includes('calcium')||n.includes('iron'))return'supplement';if(n.includes('dog')||n.includes('puppy'))return'dog';if(n.includes('toilet bowl')||n.includes('toilet gel')||n.includes('toilet stamp'))return'toilet';return'default'}

function status(x){if(x.qty<=0)return'Out';if(x.qty<2)return'Low';return'Have'}function cls(s){return s.toLowerCase()}
function nav(){const items=['Home','Inventory','Shopping','Recipes','More'];const keys={Home:'home',Inventory:'inventory',Shopping:'shopping',Recipes:'recipes',More:'more'};const html=items.map(x=>`<button class="${page===x?'active':''}" onclick="go('${x}')">${icon(keys[x])}${x}</button>`).join('');document.getElementById('nav').innerHTML=html;document.getElementById('bottom').innerHTML=html}
function go(p){page=p;render()}
function render(){const active=document.activeElement;const focusId=active&&active.id;const start=active&&typeof active.selectionStart==='number'?active.selectionStart:null;const end=active&&typeof active.selectionEnd==='number'?active.selectionEnd:null;nav();document.getElementById('main').innerHTML=page==='Home'?home():page==='Inventory'?inventory():page==='Shopping'?shoppingPage():page==='Recipes'?recipePage():more();if(focusId){const next=document.getElementById(focusId);if(next){next.focus();if(start!==null&&typeof next.setSelectionRange==='function'){const pos=Math.min(start,next.value.length);next.setSelectionRange(pos,Math.min(end??pos,next.value.length));}}}}
function home(){const attention=data.filter(x=>x.qty<2);const suggested=new Set(shopping.map(x=>x.name));const can=recipes.filter(canMake).length;const quotes=['Small systems make hard days easier.','Make the next useful thing easy to do.','You do not need to remember everything. You just need a place to put it.','Progress counts even when it is quiet.','A little order can give your mind some room.'];const quote=quotes[new Date().getDate()%quotes.length];return `<section class="hero"><div class="hero-mark">${logo().replace('class="logo"','class="logo"')}</div><h1>Good to see you.</h1><p>HomeBase keeps the things you forget visible, so you can check instead of trying to remember.</p><div class="daily-quote"><span>Today</span><strong>“${quote}”</strong></div></section><div class="grid home-stats"><div class="card stat-card"><div class="small">Needs attention</div><div class="stat">${attention.length}</div><div class="small">low or out</div></div><div class="card stat-card"><div class="small">Shopping list</div><div class="stat">${suggested.size}</div><div class="small">items to buy</div></div><div class="card stat-card"><div class="small">Can make now</div><div class="stat">${can}</div><div class="small">saved recipes</div></div></div><div class="section">${icon('alert')} Check these</div><div class="grid">${attention.slice(0,8).map(itemCard).join('')||'<div class="card">Everything looks good right now.</div>'}</div><div class="section">${icon('search')} Quick Check</div><div class="grid">${['Refrigerator','Pantry','Produce','Cleaning','Personal Care','Baby & Toddler','Pet Care'].map(c=>quickCard(c)).join('')}</div>`}
function quickCard(c){const key=c==='Refrigerator'?'fridge':c==='Pantry'?'pantry':c==='Produce'?'leaf':c==='Cleaning'?'clean':c==='Personal Care'?'user':c==='Baby & Toddler'?'baby':'paw';return `<div class="card category-card" onclick="quick('${c}')"><div class="category-art" style="background:${c==='Refrigerator'?'var(--blue)':c==='Pantry'?'var(--gold)':c==='Produce'?'var(--sage2)':c==='Cleaning'?'var(--lav)':c==='Personal Care'?'var(--peach)':c==='Baby & Toddler'?'var(--blue)':'var(--sage2)'}">${icon(key)}</div><div><b>${c}</b><div class="small">Tap to check what’s on hand</div></div></div>`}
function itemCard(x){return `<div class="card item card-click" onclick="openItem(${x.id})"><div class="item-main">${itemArt(x.name)}<div><div class="item-name">${esc(x.name)}</div><div class="small">${formatQty(x)} · ${esc(x.cat)}</div></div></div><span class="pill ${cls(status(x))}">${status(x)}</span></div>`}
function formatQty(x){return `${x.qty} ${x.unit}`}
function inventory(){let arr=data.filter(x=>(filter==='All'||x.cat===filter)&&x.name.toLowerCase().includes(query.toLowerCase()));return `<div class="toolbar"><input class="search" id="inventorySearch" placeholder="Search inventory..." value="${esc(query)}" oninput="query=this.value;render()"><button class="secondary" onclick="startQuickCheck()">${icon('search')} Quick Check</button><button class="primary" onclick="openAdd()">${icon('plus')} Add item</button></div><div class="toolbar filters">${cats.map(c=>`<button class="${filter===c?'active':''}" onclick="filter='${escJs(c)}';render()">${c}</button>`).join('')}</div><div class="inventory-grid">${arr.map(x=>`<div class="card inventory-tile"><div class="item card-click" onclick="openItem(${x.id})"><div class="item-main">${itemArt(x.name)}<div style="width:100%"><div class="item-name">${esc(x.name)}</div><div class="small">${formatQty(x)}</div></div></div><span class="pill ${cls(status(x))}">${status(x)}</span></div><div class="controls"><button onclick="event.stopPropagation();change(${x.id},-1)">${icon('minus')}</button><div class="qty">${x.qty}</div><button onclick="event.stopPropagation();change(${x.id},1)">${icon('plus')}</button><button class="out-btn" onclick="event.stopPropagation();setOut(${x.id})">Out</button></div></div>`).join('')||'<div class="empty">No items found.</div>'}</div>`}
function shoppingPage(){return `<div id="shoppingPage">${shoppingContent()}</div>`}
function shoppingContent(){const rows=shopping;const sq=(window.shoppingQuery||'').toLowerCase();const catalog=data.filter(x=>x.name.toLowerCase().includes(sq)||x.cat.toLowerCase().includes(sq));return `<div class="hero"><h1>${icon('shopping')} Shopping</h1><p>Keep your active shopping list separate from the full HomeBase catalog.</p></div><section class="shopping-active"><div class="section">${icon('check')} Active Shopping List <span class="small" style="margin-left:auto">${rows.length} item${rows.length===1?'':'s'}</span></div><div class="card shopping-active-card">${rows.map(s=>shoppingRow(s)).join('')||'<div class="empty">Your shopping list is clear. Tap an item below to add it.</div>'}</div></section><section class="shopping-catalog"><div class="section">${icon('search')} Master Inventory Catalog</div><div class="shopping-catalog-intro"><div style="flex:1"><input class="search" id="shoppingSearch" placeholder="Search items to add..." value="${esc(window.shoppingQuery||'')}" oninput="window.shoppingQuery=this.value;refreshShopping()"></div><button class="primary" onclick="openCustomShopping()">${icon('plus')} Custom Item</button></div><div class="small" style="margin-bottom:10px">Tap any item to add it to your active shopping list.</div><div class="shopping-catalog-grid">${catalog.map(shoppingCatalogTile).join('')||'<div class="empty">No catalog items match that search.</div>'}</div></section>`}function shoppingRow(s){return `<div class="list-row"><button class="check ${s.done?'done':''}" onclick="toggleShop('${escJs(s.name)}')">${s.done?icon('check'):''}</button><div style="flex:1"><b>${esc(s.name)}</b><div class="small">${inventoryByName(s.name)?formatQty(inventoryByName(s.name)):'Custom item'}</div></div><button class="secondary" onclick="removeShop('${escJs(s.name)}')">Remove</button></div>`}
function shoppingCatalogTile(x){const active=shopping.some(s=>s.name.toLowerCase()===x.name.toLowerCase());return `<button class="shopping-catalog-tile ${active?'catalog-added':''}" onclick="addCatalogShopping(${x.id})"><div class="catalog-art">${itemArt(x.name)}</div><div class="catalog-name">${esc(x.name)}</div><div class="small">${esc(x.cat)}</div><span class="catalog-action">${active?'Added':'Add'}</span></button>`}
function inventoryByName(n){return data.find(x=>x.name.toLowerCase()===n.toLowerCase())}
function addCatalogShopping(id){const x=data.find(a=>a.id===id);if(!x)return;if(shopping.some(s=>s.name.toLowerCase()===x.name.toLowerCase())){toast(x.name+' is already on your list');return}shopping.push({name:x.name,done:false});save();refreshShopping();toast(x.name+' added to shopping')}
function addAllSuggested(){data.filter(x=>x.qty<2).forEach(x=>{if(!shopping.some(s=>s.name===x.name))shopping.push({name:x.name,done:false})});save();refreshShopping();toast('Low and out items added')}
function toggleShop(name){let s=shopping.find(x=>x.name===name);if(!s){shopping.push({name,done:true})}else{s.done=!s.done}save();refreshShopping()}
function removeShop(name){shopping=shopping.filter(x=>x.name!==name);save();refreshShopping();toast('Removed from list')}
function refreshShopping(){const active=document.activeElement;const focusId=active&&active.id;const start=active&&typeof active.selectionStart==='number'?active.selectionStart:null;const end=active&&typeof active.selectionEnd==='number'?active.selectionEnd:null;const root=document.getElementById('shoppingPage');if(root)root.innerHTML=shoppingContent();if(focusId){const next=document.getElementById(focusId);if(next){next.focus();if(start!==null&&typeof next.setSelectionRange==='function'){const pos=Math.min(start,next.value.length);next.setSelectionRange(pos,Math.min(end??pos,next.value.length));}}}}
function recipeMatchesPrefs(r){const text=(r.name+' '+r.ingredients.map(i=>i[0]).join(' ')).toLowerCase();return !prefs.some(p=>text.includes(p.toLowerCase()))}
function equipmentAvailable(r){return r.equipment.every(e=>equipment[e]!==false)}
function missing(r){return r.ingredients.filter(i=>{if(i[3]===false)return false;const x=inventoryByName(i[0]);return !x||Number(x.qty)<Number(i[1])})}
function canMake(r){return recipeMatchesPrefs(r)&&equipmentAvailable(r)&&missing(r).length===0}
function recipePage(){let arr=recipes.filter(r=>(meal==='All'||r.meal===meal)&&r.name.toLowerCase().includes(query.toLowerCase())&&recipeMatchesPrefs(r));return `<div class="toolbar"><input class="search" id="recipeSearch" placeholder="Search recipes..." value="${esc(query)}" oninput="query=this.value;render()"><button class="primary" onclick="openRecipe()">${icon('plus')} Recipe</button></div><div class="toolbar filters">${['All',...meals].map(m=>`<button class="${meal===m?'active':''}" onclick="meal='${escJs(m)}';render()">${m}</button>`).join('')}</div><div class="grid">${arr.map(recipeCard).join('')||'<div class="empty">No matching recipes.</div>'}</div>`}
function recipeCard(r){const miss=missing(r),equip=!equipmentAvailable(r),can=miss.length===0&&!equip;return `<div class="card recipe-card"><div class="recipe-head">${recipeArt(r)}<div style="flex:1"><div class="recipe-title">${esc(r.name)}</div><div style="margin-top:5px"><span class="pill neutral">${esc(r.meal)}</span> ${r.tags.map(t=>`<span class="pill have" style="margin-left:4px">${esc(t)}</span>`).join('')}</div></div></div>${miss.length?`<div class="missing-banner"><b>Missing ${miss.length} ingredient${miss.length===1?'':'s'}</b><div class="small" style="margin-top:3px">${miss.map(i=>`${esc(i[0])} · need ${i[1]} ${esc(i[2])}`).join(' · ')}</div><button class="secondary" style="margin-top:8px" onclick="addRecipeMissing(${r.id})">Add missing to shopping</button></div>`:''}<div>${r.ingredients.map(i=>{const x=inventoryByName(i[0]);const have=x?Number(x.qty):0;const needed=Number(i[1]);const ok=have>=needed;return `<div class="ingredient"><span>${esc(i[0])} · ${i[1]} ${esc(i[2])}</span><b class="${ok?'available':'missing'}">${have}${x?'':' · not tracked'}</b></div>`}).join('')}</div><div class="small">Equipment: ${r.equipment.join(', ')||'None'}${equip?' · Turn on missing equipment in More':''}</div>${r.url?`<div style="margin-top:8px"><a class="secondary" style="display:inline-block;text-decoration:none" href="${safeUrl(r.url)}" target="_blank" rel="noopener">Open video / recipe link</a></div>`:''}${r.notes?`<details style="margin-top:8px"><summary class="small" style="cursor:pointer;font-weight:700">View pasted notes</summary><div class="recipe-notes">${esc(r.notes)}</div></details>`:''}<div class="recipe-actions"><button class="primary" style="flex:1" onclick="cook(${r.id})" ${can?'':'disabled'}>${icon('check')} Cook & Update</button><button class="secondary" onclick="openRecipe(${r.id})">Edit</button></div></div>`}
function addRecipeMissing(id){const r=recipes.find(x=>x.id===id);if(!r)return;missing(r).forEach(i=>{if(!shopping.some(s=>s.name.toLowerCase()===i[0].toLowerCase()))shopping.push({name:i[0],done:false})});save();render();toast('Missing ingredients added to shopping')}
function cook(id){const r=recipes.find(x=>x.id===id);if(!canMake(r)){toast('Recipe is not ready to cook');return}r.ingredients.forEach(i=>{if(i[3]===false)return;const x=inventoryByName(i[0]);if(x){x.qty=Math.max(0,Math.round((x.qty-i[1])*100)/100)}});shopping=shopping.filter(s=>{const x=inventoryByName(s.name);return !r.ingredients.some(i=>i[0].toLowerCase()===s.name.toLowerCase())||!x||x.qty>=2});save();render();toast(r.name+' cooked — inventory updated')}
function more(){return `<div class="hero"><h1>${icon('settings')} HomeBase</h1><p>Keep the app simple. Turn on the kitchen equipment you actually have and adjust preferences when you want to.</p></div><div class="section">Kitchen equipment</div><div class="card">${Object.entries(equipment).map(([k,v])=>`<div class="equip-row"><span>${k}</span><button class="toggle ${v?'on':''}" onclick="equipment['${escJs(k)}']=${!v};save();render()"><span></span></button></div>`).join('')}</div><div class="section">Food preferences</div><div class="card"><div class="small">Starter recipes avoid these foods. Add more later if you want.</div><div style="margin-top:9px">${prefs.map(p=>`<span class="pill out" style="margin:4px 5px 0 0">${p}</span>`).join('')}</div></div><div class="section">Data</div><div class="card"><button class="danger" onclick="resetData()">${icon('trash')} Reset starter data</button></div>`}
function openItem(id){const x=data.find(a=>a.id===id);if(!x)return;document.getElementById('modalbox').innerHTML=`<h2>${x.name}</h2><div class="small">${x.cat}</div><div style="display:flex;justify-content:center;margin:16px 0">${itemArt(x.name)}</div><div class="status-grid"><button class="${status(x)==='Have'?'selected have':''}" onclick="setStatus(${id},'Have')">Have</button><button class="${status(x)==='Low'?'selected low':''}" onclick="setStatus(${id},'Low')">Low</button><button class="${status(x)==='Out'?'selected out':''}" onclick="setStatus(${id},'Out')">Out</button></div><label class="field"><span>Approximate quantity</span><input id="iq" type="number" step="0.25" value="${x.qty}"></label><label class="field"><span>Unit</span><input id="iu" value="${esc(x.unit)}"></label><div class="modal-actions"><button class="primary" onclick="saveItem(${id})">${icon('save')} Save</button><button class="secondary" onclick="closeModal()">Cancel</button><button class="danger" onclick="deleteItem(${id})">Delete</button></div>`;openModal()}
function setStatus(id,s){const x=data.find(a=>a.id===id);if(s==='Out')x.qty=0;else if(s==='Low')x.qty=x.qty>0&&x.qty<2?x.qty:0.5;else x.qty=x.qty>=2?x.qty:1;save();openItem(id)}
function saveItem(id){const x=data.find(a=>a.id===id);x.qty=Math.max(0,Number(document.getElementById('iq').value)||0);x.unit=document.getElementById('iu').value.trim()||'item';save();closeModal();render();toast(x.name+' updated')}
function deleteItem(id){if(!confirm('Delete this inventory item?'))return;data=data.filter(x=>x.id!==id);save();closeModal();render();toast('Item deleted')}
function openAdd(){document.getElementById('modalbox').innerHTML=`<h2>Add inventory item</h2><label class="field"><span>Name</span><input id="an" placeholder="e.g. Ginger"></label><div class="small">Common items</div><div class="starter-grid">${['Ginger','Onion','Eggs','Rice','Salt','Olive Oil','Vinegar','Trash Bags','Cleaning Wipes','Air Filter'].map(n=>`<button type="button" onclick="document.getElementById('an').value='${escJs(n)}'">${n}</button>`).join('')}</div><label class="field"><span>Category</span><select id="ac">${cats.slice(1).map(c=>`<option>${c}</option>`).join('')}</select></label><div class="toolbar"><label class="field" style="flex:1"><span>Approx. quantity</span><input id="aq" type="number" step="0.25" value="1"></label><label class="field" style="flex:1"><span>Unit</span><input id="au" value="item"></label></div><div class="modal-actions"><button class="primary" onclick="addItem()">${icon('save')} Save</button><button class="secondary" onclick="closeModal()">Cancel</button></div>`;openModal()}
function addItem(){const n=document.getElementById('an').value.trim();if(!n){toast('Add a name first');return}const existing=inventoryByName(n);if(existing){toast('That item is already in inventory');return}data.push({id:Date.now(),name:n,cat:document.getElementById('ac').value,qty:Math.max(0,Number(document.getElementById('aq').value)||0),unit:document.getElementById('au').value.trim()||'item'});save();closeModal();page='Inventory';render();toast(n+' added')}
function openShoppingAdd(){openCustomShopping()}
function openCustomShopping(){document.getElementById('modalbox').innerHTML=`<h2>Add custom shopping item</h2><label class="field"><span>Item name</span><input id="sn" placeholder="e.g. Lemons or birthday candles"></label><div class="modal-actions"><button class="primary" onclick="addShopping()">${icon('plus')} Add</button><button class="secondary" onclick="closeModal()">Cancel</button></div>`;openModal()}
function addShopping(){const n=document.getElementById('sn').value.trim();if(!n){toast('Add a name first');return}if(shopping.some(x=>x.name.toLowerCase()===n.toLowerCase())){toast(n+' is already on your list');return}shopping.push({name:n,done:false});save();closeModal();if(page==='Shopping')refreshShopping();else render();toast(n+' added to shopping')}
function openRecipe(id=null){const r=id?recipes.find(x=>x.id===id):null;document.getElementById('modalbox').innerHTML=`<h2>${r?'Edit recipe':'Add recipe'}</h2><label class="field"><span>Name</span><input id="rn" value="${r?esc(r.name):''}" placeholder="Recipe name"></label><label class="field"><span>Meal</span><select id="rm">${meals.map(m=>`<option ${r&&r.meal===m?'selected':''}>${m}</option>`).join('')}</select></label><label class="field"><span>Ingredients</span><div class="small">Choose an inventory item when possible. Untracked ingredients are allowed.</div><div id="ingredientRows"></div><button class="secondary" type="button" onclick="addIngredientRow()">${icon('plus')} Add ingredient</button></label><label class="field"><span>Equipment</span><input id="re" value="${r?esc(r.equipment.join(', ')):''}" placeholder="Stove, Air Fryer"></label><label class="field"><span>Tags</span><input id="rt" value="${r?esc(r.tags.join(', ')):''}" placeholder="Light, High Protein"></label><label class="field"><span>Video / Recipe URL</span><input id="ru" type="url" value="${r?esc(r.url||''):''}" placeholder="Paste TikTok, YouTube, or Instagram link"></label><label class="field"><span>Recipe Notes / Pasted Copy</span><textarea id="rc" rows="6" placeholder="Paste the recipe text, video caption, notes, or anything you want to keep with this recipe...">${r?esc(r.notes||''):''}</textarea></label><div class="modal-actions"><button class="primary" onclick="saveRecipe(${r?r.id:'null'})">${icon('save')} Save</button><button class="secondary" onclick="closeModal()">Cancel</button>${r?`<button class="danger" onclick="deleteRecipe(${r.id})">Delete</button>`:''}</div>`;openModal();const rows=r?.ingredients||[];if(rows.length)rows.forEach(i=>addIngredientRow(i));else addIngredientRow()}
function addIngredientRow(v=['',1,'item',true]){const wrap=document.getElementById('ingredientRows');if(!wrap)return;const row=document.createElement('div');row.className='recipe-editor-row';const options=['<option value="">Untracked / custom</option>',...data.map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`)];row.innerHTML=`<select class="ing-name">${options.join('')}</select><input class="ing-amount" type="number" min="0" step="0.25" value="${Number(v[1])||1}" aria-label="Amount"><input class="ing-unit" value="${esc(v[2]||'item')}" aria-label="Unit"><button class="mini-remove" type="button" onclick="this.parentElement.remove()" aria-label="Remove ingredient">${icon('trash')}</button>`;wrap.appendChild(row);const sel=row.querySelector('.ing-name');sel.value=v[0]||'';if(v[0]&&!sel.value)sel.insertAdjacentHTML('beforeend',`<option value="${esc(v[0])}">${esc(v[0])}</option>`),sel.value=v[0]}
function saveRecipe(id){const n=document.getElementById('rn').value.trim();if(!n){toast('Add a recipe name first');return}const ing=[...document.querySelectorAll('#ingredientRows .recipe-editor-row')].map(row=>{const name=row.querySelector('.ing-name').value.trim();const amount=Math.max(0,Number(row.querySelector('.ing-amount').value)||0);const unit=row.querySelector('.ing-unit').value.trim()||'item';return name?[name,amount,unit,true]:null}).filter(Boolean);if(!ing.length){toast('Add at least one ingredient');return}const obj={id:id?Number(id):Date.now(),name:n,meal:document.getElementById('rm').value,equipment:document.getElementById('re').value.split(',').map(x=>x.trim()).filter(Boolean),tags:document.getElementById('rt').value.split(',').map(x=>x.trim()).filter(Boolean),url:document.getElementById('ru').value.trim(),notes:document.getElementById('rc').value,ingredients:ing};if(id)recipes=recipes.map(r=>r.id===Number(id)?obj:r);else recipes.push(obj);save();closeModal();page='Recipes';render();toast(n+' saved')}
function deleteRecipe(id){if(!confirm('Delete this recipe?'))return;recipes=recipes.filter(r=>r.id!==id);save();closeModal();render();toast('Recipe deleted')}
function quick(c){filter=c;page='Inventory';render()}
function startQuickCheck(){const arr=data.filter(x=>filter==='All'||x.cat===filter).filter(x=>x.name.toLowerCase().includes(query.toLowerCase()));if(!arr.length){toast('Nothing to check');return}let i=0;const box=document.createElement('div');box.id='quickMode';box.className='quick-mode';document.body.appendChild(box);function show(){const x=arr[i];box.innerHTML=`<div class="quick-wrap"><div class="quick-top"><button class="secondary" onclick="document.getElementById('quickMode').remove()">${icon('close')} Exit</button><div class="small">${i+1} of ${arr.length}</div></div><div class="quick-item">${itemArt(x.name)}<div class="quick-name">${x.name}</div><div class="quick-meta">${x.cat} · ${formatQty(x)}</div><div class="progress"><span style="width:${Math.round(((i+1)/arr.length)*100)}%"></span></div><div class="quick-actions"><button class="qhave" onclick="quickSet(${x.id},'Have')">Have</button><button class="qlow" onclick="quickSet(${x.id},'Low')">Low</button><button class="qout" onclick="quickSet(${x.id},'Out')">Out</button></div><div class="quick-next"><button class="secondary" onclick="quickStep(-1)" ${i===0?'disabled':''}>Back</button><button class="primary" onclick="quickStep(1)">${i===arr.length-1?'Finish':'Next'}</button></div></div></div>`;window.__quick={arr,i,show};}show();}
function quickStep(dir){if(!window.__quick)return;window.__quick.i+=dir;if(window.__quick.i>=window.__quick.arr.length){document.getElementById('quickMode')?.remove();toast('Quick Check complete');delete window.__quick;return}if(window.__quick.i<0)window.__quick.i=0;window.__quick.show()}
function quickSet(id,s){const x=data.find(a=>a.id===id);if(!x)return;if(s==='Out')x.qty=0;else if(s==='Low')x.qty=x.qty>0&&x.qty<2?x.qty:0.5;else x.qty=x.qty>=2?x.qty:1;save();window.__quick.show();}
function openModal(){document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.style.display='none',1800)}
function resetData(){if(!confirm('Reset HomeBase to its starter data?'))return;localStorage.removeItem('homebase.v2.inventory');localStorage.removeItem('homebase.v2.recipes');localStorage.removeItem('homebase.v2.equipment');localStorage.removeItem('homebase.v2.shopping');localStorage.removeItem('homebase.v2.prefs');location.reload()}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function escJs(s){return String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function safeUrl(s){const u=String(s??'').trim();try{const p=new URL(u,location.href);return ['http:','https:'].includes(p.protocol)?p.href:'#'}catch{return '#'}}
document.getElementById('brand').innerHTML=logo()+'<span class="brand-name">HomeBase</span>';document.getElementById('topAdd').innerHTML=icon('plus')+'<span class="label">Add</span>';render();
</script>

<script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script>
</body>
